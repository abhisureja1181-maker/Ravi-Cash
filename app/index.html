  <script>
    /* A sandboxed preview (an iframe without "allow-forms") blocks form submission before the app can handle it.
       There, run the form's own submit handler directly. Normal browsers are not affected. */
    try {
      if (window.origin === 'null' && location.protocol !== 'file:') {
        document.addEventListener('click', function (e) {
          var b = e.target && e.target.closest && e.target.closest('button[type=submit],input[type=submit]');
          if (!b || !b.form || b.disabled) return;
          e.preventDefault();
          var f = b.form;
          if (!f.noValidate && f.checkValidity && !f.checkValidity()) { if (f.reportValidity) f.reportValidity(); return; }
          f.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        }, true);
      }
    } catch (e) { /* ignore */ }
  </script>

          window.addEventListener('load', function () { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} });
        }
      } catch (e) { /* sandboxed preview: no service worker */ }
